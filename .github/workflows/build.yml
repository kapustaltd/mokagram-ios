name: Build Mokagram IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select pinned Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          test -d "/Applications/Xcode_$XCODE_VERSION.app" || {
            echo "::error::Required Xcode $XCODE_VERSION is missing from this runner"
            exit 1
          }
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          xcodebuild -version

      - name: Prepare configuration and signing material
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          # All five set: real ad-hoc signing (see README). None set: placeholder, unsigned IPA.
          MOKAGRAM_SIGNING_P12_BASE64: ${{ secrets.MOKAGRAM_SIGNING_P12_BASE64 }}
          MOKAGRAM_SIGNING_P12_PASSWORD: ${{ secrets.MOKAGRAM_SIGNING_P12_PASSWORD }}
          MOKAGRAM_PROFILES_ZIP_BASE64: ${{ secrets.MOKAGRAM_PROFILES_ZIP_BASE64 }}
          MOKAGRAM_TEAM_ID: ${{ secrets.MOKAGRAM_TEAM_ID }}
          MOKAGRAM_BUNDLE_ID: ${{ secrets.MOKAGRAM_BUNDLE_ID }}
        run: python3 build-system/mokagram/prepare.py

      - name: Import signing identity
        env:
          MOKAGRAM_SIGNING_P12_PASSWORD: ${{ secrets.MOKAGRAM_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/mokagram.keychain-db"
          security create-keychain -p placeholder "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p placeholder "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          if test -f build-input/mokagram/signing/certs/Distribution.p12; then
            security import build-input/mokagram/signing/certs/Distribution.p12 \
              -k "$KEYCHAIN" -P "$MOKAGRAM_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            echo "IPA_NAME=Mokagram-adhoc" >> "$GITHUB_ENV"
          else
            security import build-input/mokagram/signing/certs/Placeholder.p12 \
              -k "$KEYCHAIN" -P placeholder -T /usr/bin/codesign -T /usr/bin/security
            echo "IPA_NAME=Mokagram-unsigned" >> "$GITHUB_ENV"
          fi
          security set-key-partition-list -S apple-tool:,apple: -k placeholder "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: mokagram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            mokagram-bazel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json', 'MODULE.bazel', 'MODULE.bazel.lock') }}-

      - name: Build Release IPA for arm64 devices
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-input/mokagram/configuration.json \
            --codesigningInformationPath=build-input/mokagram/signing \
            --configuration=release_arm64 \
            --buildNumber="${{ github.run_number }}"
          mkdir -p build/artifacts
          cp bazel-bin/Telegram/Telegram.ipa "build/artifacts/$IPA_NAME.ipa"
          shasum -a 256 "build/artifacts/$IPA_NAME.ipa" > "build/artifacts/$IPA_NAME.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}-ipa
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/mokagram.keychain-db"
          if test -f "$KEYCHAIN"; then
            security delete-keychain "$KEYCHAIN"
          fi
          rm -rf build-input/mokagram
